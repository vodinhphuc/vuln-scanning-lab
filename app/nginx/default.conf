# nginx/default.conf — CỐ TÌNH thiếu security header.
#
# Ánh xạ giáo trình: slide 37 "Application configuration baseline".
# Mỗi dòng bị CỐ Ý bỏ đi ở đây tương ứng một finding mà `nikto` / ZAP /
# `curl -sI` sẽ báo ra ở bước app-01-config.sh.
#
# CỐ TÌNH THIẾU (đừng "sửa hộ" — đây là ground truth):
#   - Content-Security-Policy      -> chống XSS
#   - Strict-Transport-Security    -> buộc HTTPS
#   - X-Frame-Options              -> chống clickjacking
#   - X-Content-Type-Options       -> chống MIME sniffing
#   - Referrer-Policy
# CỐ TÌNH BẬT:
#   - server_tokens on             -> lộ version nginx (thông tin cho attacker)
#   - autoindex on trên /backup/   -> lộ file backup .sql (dùng ở tầng Data)

server_tokens on;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Trang chủ lab
    location / {
        try_files $uri $uri/ =404;
    }

    # Thư mục backup mở toang + liệt kê thư mục.
    # Dùng lại ở data-03-storage.sh: "file backup .sql không mã hoá trong web root".
    location /backup/ {
        autoindex on;
        autoindex_exact_size off;
    }

    # Proxy sang DVWA
    location /dvwa/ {
        proxy_pass http://dvwa:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy sang Juice Shop
    location /juice/ {
        proxy_pass http://juice-shop:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Trang lỗi mặc định của nginx (lộ version vì server_tokens on)
    error_page 500 502 503 504 /50x.html;
}
