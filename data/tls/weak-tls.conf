# TLS CỐ TÌNH YẾU — target của data-05-tls.sh (testssl.sh, nmap ssl-enum-ciphers).
# Ánh xạ: slide 46 "data in transit".
#
# CỐ TÌNH SAI (ground truth):
#   - self-signed certificate, CN không khớp
#   - bật lại TLS 1.0 và TLS 1.1 (đã bị RFC 8996 khai tử)
#   - cipher suite yếu: 3DES, RC4-ish, và cipher KHÔNG có forward secrecy
#   - @SECLEVEL=0 để OpenSSL 1.1.1 chấp nhận các cipher/protocol trên
#   - không có HSTS

server {
    listen 8443 ssl;
    server_name lab-weak-tls;

    ssl_certificate     /etc/nginx/certs/weak.crt;
    ssl_certificate_key /etc/nginx/certs/weak.key;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers "@SECLEVEL=0:DEFAULT:ALL:!aNULL:!eNULL:DES-CBC3-SHA:AES128-SHA:AES256-SHA";
    ssl_prefer_server_ciphers off;

    # KHÔNG có: add_header Strict-Transport-Security ...

    location / {
        return 200 "Weak TLS endpoint — chi dung trong lab.\n";
        add_header Content-Type text/plain;
    }
}
